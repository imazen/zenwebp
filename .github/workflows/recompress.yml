name: recompress

# Isolated CI for the nested `zenwebp-recompress/` workspace. Kept separate
# from the core `ci.yml` so that drift in the sibling path deps
# (zensim / zenpixels / zenanalyze main) can only redden THIS workflow, never
# zenwebp's core build. Triggers on changes under zenwebp-recompress/, plus a
# weekly schedule that catches sibling/toolchain drift (see the `schedule:`
# note below) and `workflow_dispatch` for on-demand runs.
on:
  push:
    branches: [main]
    paths:
      - "zenwebp-recompress/**"
      - ".github/workflows/recompress.yml"
  pull_request:
    branches: [main, "fixall/**", "stack/**"]
    paths:
      - "zenwebp-recompress/**"
      - ".github/workflows/recompress.yml"
  # The `paths:` filters above only see edits to THIS repo. The two things
  # that actually break this workspace — the sibling `main`s it path-depends
  # on (zensim / zenpixels / zenanalyze) and the `stable` toolchain — move
  # entirely outside those paths, so drift is invisible to a push trigger.
  # Measured: nothing matched the filter between 2026-06-12 and 2026-08-29,
  # and TWO independent breaks accumulated unseen in that window (zensim
  # gating `ZensimProfile::A` behind `deprecated-profiles`, and clippy's new
  # `chunks_exact_to_as_chunks`). A time trigger is the only one that can
  # catch external drift; it bounds the blind window to a week instead of a
  # quarter. Isolation is preserved — a red scheduled run still cannot block
  # zenwebp's core CI.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  # `github.head_ref` is empty on push events (it is set only for
  # pull_request), so this group fell through to the always-unique
  # `github.run_id` and pushes were never cancelled. `github.ref` is
  # populated for both event types.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: recompress (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS x64
            os: macos-26-intel
    steps:
      - name: Checkout zenwebp
        uses: actions/checkout@v6
      # The nested workspace path-depends on these siblings. Place each at
      # the parent of the zenwebp checkout so ../../<sibling> resolves.
      - name: Checkout sibling zensim
        uses: actions/checkout@v6
        with:
          repository: imazen/zensim
          ref: main
          path: __siblings/zensim
      - name: Checkout sibling zenpixels
        uses: actions/checkout@v6
        with:
          repository: imazen/zenpixels
          ref: main
          path: __siblings/zenpixels
      - name: Checkout sibling zenanalyze
        uses: actions/checkout@v6
        with:
          repository: imazen/zenanalyze
          ref: main
          path: __siblings/zenanalyze
      - name: Stage siblings beside zenwebp
        shell: bash
        run: |
          set -euo pipefail
          mv __siblings/zensim ../zensim
          mv __siblings/zenpixels ../zenpixels
          mv __siblings/zenanalyze ../zenanalyze
          rmdir __siblings || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zenwebp-recompress
      # Default-feature build = the minimal external-consumer view (no
      # expert, no zwr bin). Confirms the "minimal by default" contract.
      - name: Build (default features — minimal)
        working-directory: zenwebp-recompress
        run: cargo build
      - name: Test (workspace, default features)
        working-directory: zenwebp-recompress
        run: cargo test --workspace
      # All-features build exercises the expert API, the zwr CLI bin
      # (required-features = ["expert"]), and the analyzer deps.
      - name: Test (all features)
        working-directory: zenwebp-recompress
        run: cargo test --all-features
      - name: Clippy (all targets, all features)
        if: matrix.os == 'ubuntu-latest'
        working-directory: zenwebp-recompress
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Fmt
        if: matrix.os == 'ubuntu-latest'
        working-directory: zenwebp-recompress
        run: cargo fmt -- --check
