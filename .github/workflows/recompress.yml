name: recompress

# Isolated CI for the nested `zenwebp-recompress/` workspace. Kept separate
# from the core `ci.yml` so that breakage in the unpublished sibling deps
# (zensim / zenpixels / zenanalyze, pinned by git rev in
# zenwebp-recompress/Cargo.toml) can only redden THIS workflow, never
# zenwebp's core build. Every cargo step runs `--locked`. Triggers on changes
# under zenwebp-recompress/, plus a weekly schedule that catches toolchain
# drift (see the `schedule:` note below) and `workflow_dispatch`.
on:
  push:
    branches: [main]
    paths:
      - "zenwebp-recompress/**"
      - ".github/workflows/recompress.yml"
  pull_request:
    branches: [main, "fixall/**", "stack/**"]
    paths:
      - "zenwebp-recompress/**"
      - ".github/workflows/recompress.yml"
  # The `paths:` filters above only see edits to THIS repo. The `stable`
  # toolchain moves entirely outside those paths, so its drift is invisible
  # to a push trigger. (Until 2026-10-25 the siblings were path deps on
  # their moving `main`s and drifted the same way; they are now pinned.)
  # Measured: nothing matched the filter between 2026-06-12 and 2026-08-29,
  # and TWO independent breaks accumulated unseen in that window (zensim
  # gating `ZensimProfile::A` behind `deprecated-profiles`, and clippy's new
  # `chunks_exact_to_as_chunks`). A time trigger is the only one that can
  # catch external drift; it bounds the blind window to a week instead of a
  # quarter. Isolation is preserved — a red scheduled run still cannot block
  # zenwebp's core CI.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  # `github.head_ref` is empty on push events (it is set only for
  # pull_request), so this group fell through to the always-unique
  # `github.run_id` and pushes were never cancelled. `github.ref` is
  # populated for both event types.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: recompress (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows arm64
            os: windows-11-arm
          - name: macOS arm64
            os: macos-latest
    steps:
      - name: Checkout zenwebp
        uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zenwebp-recompress
      # Default-feature build = the minimal external-consumer view (no
      # expert, no zwr bin). Confirms the "minimal by default" contract.
      - name: Build (default features — minimal)
        working-directory: zenwebp-recompress
        run: cargo build --locked
      - name: Test (workspace, default features)
        working-directory: zenwebp-recompress
        run: cargo test --locked --workspace
      # All-features build exercises the expert API, the zwr CLI bin
      # (required-features = ["expert"]), and the analyzer deps.
      - name: Test (all features)
        working-directory: zenwebp-recompress
        run: cargo test --locked --all-features
      - name: Clippy (all targets, all features)
        if: matrix.os == 'ubuntu-latest'
        working-directory: zenwebp-recompress
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Fmt
        if: matrix.os == 'ubuntu-latest'
        working-directory: zenwebp-recompress
        run: cargo fmt -- --check
