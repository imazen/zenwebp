name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_animated
          - decode_still
          - decode_v2
          # Encode-side targets carry the exact roundtrip oracle: fuzz bytes
          # drive a content generator + the method/quality grid, and decoded
          # pixels must match the source. This is the guard for the
          # "encoder emits a valid-but-wrong stream" class (#72) that
          # decode-only fuzzing structurally cannot see.
          - encode_lossless_roundtrip
          - encode_lossy_roundtrip
          # Container/mux + metadata entry points — never reached by the
          # WebPDecoder-based targets (it walks VP8X itself). A 38-byte
          # VP8X+ANIM file reached an OOB panic here.
          - demux_container
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          cache-directories: fuzz/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Determine duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/regression/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp fuzz/seed_corpus/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=${{ steps.duration.outputs.seconds }} \
               -dict=fuzz/webp.dict \
               -rss_limit_mb=2048

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30

  regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # No fallback `|| echo` here: it used to turn a FAILING harness into a
      # green step ("gate that doesn't gate"). The harness itself asserts that
      # fuzz/regression/ is non-empty, so a missing dir fails loudly too.
      - name: Regression seeds
        run: cargo test --test fuzz_regression
