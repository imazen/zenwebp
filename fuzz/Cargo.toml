[package]
name = "webp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zenwebp]
path = ".."
features = ["inventory"]

[dependencies.zencodec]
version = ">=0.1.27, <0.3.0"

# zencodec#133 (structural inventories); swap for the released zencodec before
# merging, together with the same patch in the root Cargo.toml.
[patch.crates-io]
# Merged pixel-context bridge; keep root, fuzz and recompress on one revision.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "8d8dee412702b40f1d01d398a018074a2b6de5e9" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "8d8dee412702b40f1d01d398a018074a2b6de5e9" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "d327434b0826a3e39633665c76f5081c0ceb34cc" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_still"
path = "fuzz_targets/decode_still.rs"
test = false
doc = false

[[bin]]
name = "decode_animated"
path = "fuzz_targets/decode_animated.rs"
test = false
doc = false

[[bin]]
name = "decode_v2"
path = "fuzz_targets/decode_v2.rs"
test = false
doc = false

[[bin]]
name = "encode_lossless_roundtrip"
path = "fuzz_targets/encode_lossless_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "encode_lossy_roundtrip"
path = "fuzz_targets/encode_lossy_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "demux_container"
path = "fuzz_targets/demux_container.rs"
test = false
doc = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
