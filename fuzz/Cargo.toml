[package]
name = "webp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.zenwebp]
path = ".."
features = ["inventory"]

[dependencies.zencodec]
version = ">=0.2.0, <0.3.0"

# The zencodec 0.2 family revision the root Cargo.toml patches; swap both for the
# released zencodec before releasing.
[patch.crates-io]
# Merged pixel-context bridge; keep root, fuzz and recompress on one revision.
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "5bf81d640752793454802d7a94346c3c1e97c81e" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "5bf81d640752793454802d7a94346c3c1e97c81e" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "8f5cbd22ef8b1d196e96fe826dda0933040fe02a" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_still"
path = "fuzz_targets/decode_still.rs"
test = false
doc = false

[[bin]]
name = "decode_animated"
path = "fuzz_targets/decode_animated.rs"
test = false
doc = false

[[bin]]
name = "decode_v2"
path = "fuzz_targets/decode_v2.rs"
test = false
doc = false

[[bin]]
name = "encode_lossless_roundtrip"
path = "fuzz_targets/encode_lossless_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "encode_lossy_roundtrip"
path = "fuzz_targets/encode_lossy_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "demux_container"
path = "fuzz_targets/demux_container.rs"
test = false
doc = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false
